[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gstore"
version = "0.1.0"
description = "Multi-account Google Drive aggregator (desktop, local-only)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "platformdirs>=4.2",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "keyring>=25.0",
    "cryptography>=42.0",
    # Stdlib urllib has no CA store in a packaged build; see gstore.tls.
    "certifi>=2024.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gstore = "gstore.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gstore = ["db/*.sql", "auth/client_config.json"]
