# Builds Gstore for every platform and publishes them as a GitHub Release.
#
# PyInstaller does not cross-compile — it bundles the host's Python and Qt
# libraries — so each platform must be built on its own runner. That is the
# whole reason this workflow exists: a Windows .exe cannot be produced on a Mac.
#
# Trigger by pushing a version tag:
#     git tag v0.0.3 && git push origin v0.0.3
# or run it manually from the Actions tab to get artifacts without releasing.
#
# REQUIRED SECRET: GSTORE_CLIENT_CONFIG — the contents of
# src/gstore/auth/client_config.json (the bundled OAuth Desktop client). That
# file is gitignored, so without the secret the built apps raise
# ClientSecretsNotFound and nobody can sign in. Set it at
# Settings -> Secrets and variables -> Actions.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux (x86_64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt needs these present at build time for PyInstaller to find and bundle
      # them, and again at run time. The GitHub runner image does not carry
      # them, and PySide6 fails at import without libEGL in particular.
      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libxrandr2 libxi6 libxtst6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pillow

      - name: Restore the bundled OAuth client
        shell: bash
        env:
          CLIENT_CONFIG: ${{ secrets.GSTORE_CLIENT_CONFIG }}
        run: |
          if [ -z "$CLIENT_CONFIG" ]; then
            echo "::error::GSTORE_CLIENT_CONFIG secret is not set — the build would ship an app that cannot sign in."
            exit 1
          fi
          printf '%s' "$CLIENT_CONFIG" > src/gstore/auth/client_config.json
          python -c "import json;json.load(open('src/gstore/auth/client_config.json'));print('client config is valid JSON')"

      - name: Run the tests
        env:
          # No display on a runner; the Qt tests construct real widgets.
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Generate the icons
        run: python packaging/make_icon.py

      - name: Build
        run: pyinstaller packaging/gstore.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/make_dmg.py
          # Rename to a version-less asset name. The direct-download URL
          # (/releases/latest/download/<name>) hardcodes the filename, so a
          # version in it would break the link on every new release.
          built=$(ls dist/*.dmg | head -1)
          case "$(uname -m)" in
            arm64)  stable="dist/Gstore-macos-arm64.dmg" ;;
            *)      stable="dist/Gstore-macos-intel.dmg" ;;
          esac
          mv "$built" "$stable"
          echo "packaged $stable"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Version-less name: see the macOS step for why.
          Compress-Archive -Path dist/Gstore/* -DestinationPath "dist/Gstore-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # A tarball, not an AppImage: PyInstaller's COLLECT directory already
          # carries its own Qt, so this runs on any reasonably current distro
          # without a packaging toolchain in the middle. Preserves the
          # executable bit, which a zip would not.
          tar -C dist -czf dist/Gstore-linux-x64.tar.gz Gstore
          ls -lh dist/Gstore-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: gstore-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The "What's new" section below is written per release and does NOT
      # update itself — rewrite it when cutting the next version, or that
      # version ships describing this one.
      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh artifacts/
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gstore ${GITHUB_REF_NAME}" \
            --notes-file - <<'NOTES'
          ## What's new in 0.1.5

          **Folders, in both directions.** Upload a folder and its structure is
          kept, with the files spread across whichever accounts have room — a
          folder larger than any single account needs nothing special, because
          each file is placed independently and one too big for all of them is
          still split across several. Download a folder and it is rebuilt from
          wherever its pieces live, every file checksum-verified on the way in.

          - **Faster.** Both directions transfer eight files at a time, and
            small files go up in a single request instead of opening a
            resumable session they have nothing to resume.
          - **Interrupted transfers carry on.** Both directions skip what is
            already there, so stopping at file 200 of 282 and starting again
            does the remaining 82, not all 282.
          - **Dependency folders are left out.** `node_modules`, `__pycache__`,
            `build` and the like, with the count shown before anything starts.
            One project folder here went from 17,995 files to 60.

          **Your Drive stays tidy.** Everything Gstore writes now goes inside a
          single `Gstore` folder on each account instead of loose in My Drive's
          root. **Tidy up my Drive** on the Storage tab moves files uploaded by
          earlier versions into it — metadata only, so nothing is re-uploaded,
          nothing is re-downloaded, and existing share links keep working.

          **Large files start sooner.** A file split across accounts used to be
          read end to end for its checksum before the first piece went out —
          minutes of a progress bar that could not move. The checksum now runs
          while the pieces upload, so the transfer starts immediately.

          Upgrading is automatic and keeps everything: the local index migrates
          itself on first launch, and files uploaded by earlier versions stay
          exactly where they are until you choose to tidy them.

          ## Downloads

          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon) | [Gstore-macos-arm64.dmg](https://github.com/Parthivsurya/Gstorage/releases/latest/download/Gstore-macos-arm64.dmg) |
          | Windows 64-bit | [Gstore-windows-x64.zip](https://github.com/Parthivsurya/Gstorage/releases/latest/download/Gstore-windows-x64.zip) |
          | Linux x86_64 | [Gstore-linux-x64.tar.gz](https://github.com/Parthivsurya/Gstorage/releases/latest/download/Gstore-linux-x64.tar.gz) |

          Those links always resolve to the newest release.

          ### First launch

          These builds are **not code-signed**, so the OS will warn you.

          - **macOS** — the app is blocked on first open. Go to System Settings
            -> Privacy & Security, find the notice about Gstore, and choose
            "Open Anyway". The macOS build is Apple silicon only.
          - **Windows** — SmartScreen shows a blue or red "Windows protected
            your PC" screen, and Defender may say it could not scan the file.
            Both mean the same thing: the app is not code-signed, not that
            anything was found in it. Choose "More info" -> "Run anyway".
            Unzip first, then run `Gstore.exe` from the extracted folder,
            keeping it next to its files.
          - **Linux** — no warning, but the Qt libraries need a desktop session.
            Extract and run the binary, keeping it next to its files:

            ```
            tar -xzf Gstore-linux-x64.tar.gz
            ./Gstore/Gstore
            ```

          Gstore asks for your macOS login keychain password once, to store its
          encryption key. Choose "Always Allow" so it does not ask again.
          NOTES

