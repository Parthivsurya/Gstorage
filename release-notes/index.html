<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gstore Release Notes</title>
<meta name="description" content="Release notes for every published version of Gstore.">
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6672; --rule:#e3e7eb; --accent:#2d4f7c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#15181c; --fg:#e6e9ec; --muted:#9aa5b1; --rule:#2b3139; --accent:#8fb6e8;
    }
  }
  :root[data-theme="dark"] {
    --bg:#15181c; --fg:#e6e9ec; --muted:#9aa5b1; --rule:#2b3139; --accent:#8fb6e8;
  }
  body { background:var(--bg); color:var(--fg); margin:0;
         padding-block:3rem; padding-inline:1rem;
         font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width:40rem; margin:0 auto; }
  h1 { font-size:1.9rem; margin:0 0 .3rem; letter-spacing:-.02em; }
  .sub { color:var(--muted); margin:0 0 2rem; }
  a { color:var(--accent); }
  ul { list-style:none; padding:0; }
  li { padding:.9rem 0; border-bottom:1px solid var(--rule); }
  .ver { font-size:1.05rem; font-weight:600; }
  .date { color:var(--muted); font-size:.9rem; }
  .summary { color:var(--muted); margin:.25rem 0 0; }
  footer { margin-top:2.5rem; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Gstore release notes</h1>
  <p class="sub">Notes for each published version.</p>
  <ul>
    <li>
      <div><a class="ver" href="/release-notes/0.1.0.html">0.1.0</a>
        <span class="date">&middot; 24 October 2026</span></div>
      <p class="summary">
        Parallel chunked transfers in both directions, resumable uploads and
        downloads, Linux builds, and in-app update notices.
      </p>
    </li>
  </ul>
  <p class="sub">
    Earlier versions have no written notes; see the
    <a href="https://github.com/Parthivsurya/Gstorage/releases">GitHub releases</a>.
  </p>
  <footer><a href="/">Gstore</a> &middot; <a href="/PRIVACY">Privacy</a></footer>
</main>
</body>
</html>
